<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CureAI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <i class="fas fa-heartbeat"></i> CureAI
        </a>
        <div class="nav-links">
            <a href="login.html" class="btn btn-outline">Login</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-card-header">
                <h2>Create Account</h2>
                <p>Join CureAI for intelligent medical insights</p>
            </div>
            <form id="signupFormPage">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Min 8 chars, uppercase, lowercase, digit" required>
                    <div class="password-strength-track">
                        <div class="password-strength-bar" id="passwordStrength"></div>
                    </div>
                    <small id="strengthLabel" style="font-size:.75rem;color:var(--text-muted);margin-top:.25rem;display:block"></small>
                </div>
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-full" style="margin-top:.5rem">
                    <span class="btn-text">Create Account</span>
                    <i class="fas fa-spinner fa-spin btn-loading hidden"></i>
                </button>
            </form>
            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="auth_page.js"></script>
</body>
</html>
